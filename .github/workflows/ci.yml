name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Backlog A-06: a local Supabase stack for the "backend" browser tests.
      # Nothing here has credentials for, or talks to, the hosted project.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the local Supabase stack
        run: |
          supabase --version
          npm run supabase:start
      - name: Every migration is applied to the local stack
        run: node scripts/with-local-supabase.mjs node scripts/check-migrations.mjs
      - name: TEMP diagnose function serving
        run: |
          set +e
          mkdir -p /tmp/wd/supabase && cp -r supabase/functions supabase/config.toml /tmp/wd/supabase/
          grep -rl 'https://esm.sh/' /tmp/wd/supabase/functions | xargs sed -i -E "s#(https://esm\.sh/[^\"'?]+)([\"'])#\1?no-dts\2#g"
          grep -rh "esm.sh" /tmp/wd/supabase/functions | sort | uniq -c
          nohup supabase --workdir /tmp/wd functions serve --env-file "$PWD/e2e/backend/functions.env" > serve.log 2>&1 &
          sleep 15
          for round in 1 2; do
            for f in checkin-start panic-trigger create-payment-intent stripe-webhook send-scheduled-emails generate-plan-wizard expert-chat claim-guest-purchase admin-manage-user run-ai-job; do
              code=$(curl -s -m 60 -o /tmp/body -w '%{http_code}' http://127.0.0.1:54321/functions/v1/$f)
              echo "round $round $f -> $code $(head -c 200 /tmp/body)"
            done
          done
          docker inspect $(docker ps --format '{{.Names}}' | grep edge) --format '{{json .HostConfig.Binds}}'
          grep -v "Pull\|Download\|fs layer" serve.log | head -80 | cut -c1-400
          exit 1
